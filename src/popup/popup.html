<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>X AI 回复助手</title>
  <style>
    :root {
      --bg: #0b1219; --card: #15202b; --line: #2f3b47;
      --tx: #e7e9ea; --tx2: #b7c3cc; --tx3: #71767b;
      --pri: #1d9bf0; --ok: #00ba7c; --warn: #ffd166;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg: #f7f9fa; --card: #fff; --line: #d9e1e8; --tx: #0f1419; --tx2: #536471; --tx3: #8b98a5; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; width: 300px; background: var(--bg); color: var(--tx);
      font: 13px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
    }
    .hd { display: flex; align-items: center; gap: 9px; padding: 13px 14px; border-bottom: 1px solid var(--line); }
    .logo {
      width: 28px; height: 28px; border-radius: 8px; flex: none;
      background: linear-gradient(135deg, #1d9bf0, #7856ff);
      display: flex; align-items: center; justify-content: center; color: #fff; font-size: 15px;
    }
    .hd b { font-size: 13.5px; flex: 1; }
    .sw { position: relative; width: 38px; height: 22px; flex: none; cursor: pointer; }
    .sw input { display: none; }
    .sw i {
      position: absolute; inset: 0; border-radius: 999px; background: #38444d; transition: .18s;
    }
    .sw i::after {
      content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px;
      border-radius: 50%; background: #fff; transition: .18s;
    }
    .sw input:checked + i { background: var(--ok); }
    .sw input:checked + i::after { transform: translateX(16px); }

    .bd { padding: 13px 14px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 9px; }
    .row span { font-size: 12.5px; color: var(--tx2); }
    select, .btn {
      font-family: inherit; font-size: 12.5px; border-radius: 8px; cursor: pointer;
      border: 1px solid var(--line); background: var(--card); color: var(--tx); padding: 6px 9px;
    }
    select { max-width: 150px; }
    .btn { width: 100%; padding: 9px; font-weight: 700; background: var(--pri); color: #fff; border: 0; margin-top: 6px; }
    .btn:hover { background: #1a8cd8; }
    .btn--ghost { background: transparent; color: var(--tx2); border: 1px solid var(--line); font-weight: 600; margin-top: 8px; }
    .btn--ghost:hover { background: var(--card); color: var(--tx); }

    .st {
      margin-top: 11px; padding: 9px 11px; border-radius: 9px; font-size: 11.5px;
      background: var(--card); border: 1px solid var(--line); color: var(--tx3); line-height: 1.55;
    }
    .st.is-err { color: #f4212e; border-color: #5c2a2d; }
    .st.is-ok { color: var(--ok); border-color: #1c4a38; }
    .st b { color: var(--tx2); }
    .k { display: inline-block; background: var(--bg); border-radius: 4px; padding: 1px 5px; margin: 2px 0; }
  </style>
</head>
<body>
  <div class="hd">
    <div class="logo">✦</div>
    <b data-i18n="X AI 回复助手">X AI 回复助手</b>
    <label class="sw" data-i18n-title="启用插件"><input type="checkbox" id="enabled" aria-label="启用插件" data-i18n-aria-label="启用插件" /><i></i></label>
  </div>

  <div class="bd">
    <div class="row">
      <span data-i18n="界面语言">界面语言</span>
      <select id="uiLang" aria-label="界面语言" data-i18n-aria-label="界面语言"></select>
    </div>
    <div class="row">
      <span data-i18n="默认风格">默认风格</span>
      <select id="style"></select>
    </div>
    <div class="row">
      <span data-i18n="生成条数">生成条数</span>
      <select id="count">
        <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
      </select>
    </div>
    <button class="btn" id="openX" data-i18n="打开 X 时间线">打开 X 时间线</button>
    <button class="btn btn--ghost" id="openOpt" data-i18n="全部设置">全部设置</button>
    <div class="st" id="st"></div>
  </div>

  <script src="../shared/config.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/utils.js"></script>
  <script src="popup.js"></script>
</body>
</html>
